<div class="flex flex-col justify-between md:flex-row min-h-dvh overflow-hidden">
  <!-- Left Side: Lottie Animation -->
  <div class="relative w-full md:w-1/2 h-64 md:h-auto md">
    <ng-lottie [options]="options" class="absolute inset-0 w-full h-full" style="pointer-events: none"></ng-lottie>
  </div>

  <!-- Right Side: Login Form -->
  <div class="flex flex-col justify-center w-full lg:max-w-150 p-8 bg-white">
    <div class="text-center mb-5">
      <h2 class="text-2xl font-semibold text-gray-700">Login to SyncChat</h2>
      <p class="mt-1 text-gray-500 text-sm">Good to see you again!</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field class="w-full mb-1">
        <mat-label>Username</mat-label>
        <input matInput type="text" formControlName="userName" />
        @if (form.controls.userName.hasError('required')) {
          <mat-error>
            {{errorMessages.userName.required}}
          </mat-error>
        }
      </mat-form-field>

      <mat-form-field class="w-full mb-1">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        @if (form.controls.password.hasError('required')) {
          <mat-error>
            {{errorMessages.password.required}}
          </mat-error>
        }
      </mat-form-field>

      <button mat-flat-button color="primary" class="w-full py-3 text-lg" [disabled]="isLoginInProgress()">
        @if (isLoginInProgress()) {
          <mat-icon><mat-spinner diameter="18"></mat-spinner></mat-icon>
        }
        <span>Login</span>
      </button>
    </form>

    <div class="relative flex items-center my-3">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="mx-4 text-gray-400 text-sm">or</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <button mat-stroked-button class="w-full py-3 text-base font-medium normal-case hover:bg-gray-50 transition"
      [disabled]="isLoginInProgress()">
      <div class="flex gap-1">
        <chat-google-icon [width]="20" [height]="20" />
        <div>Continue with Google</div>
      </div>
    </button>

    <div class="text-center text-sm text-gray-600 mt-4">
      Don't have an account?
      <a [routerLink]="['../register']" class="text-blue-600 hover:underline">Register here</a>
    </div>
  </div>
</div>
