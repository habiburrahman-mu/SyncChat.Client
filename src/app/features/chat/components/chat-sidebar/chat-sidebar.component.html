<div class="flex flex-col h-full">
  <!-- Sidebar Header -->
  <div class="flex items-center justify-between px-5 py-4">
    <span class="text-lg font-semibold">Chats</span>
  </div>

  <!-- Search & New Chat Button -->
  <div class="px-5 py-4 space-y-3 flex flex-row items-center gap-2">
    <mat-form-field appearance="outline" class="w-full h-10">
      <input matInput placeholder="Search chats" />
    </mat-form-field>

    <button mat-mini-fab color="primary" (click)="createNewChat()" aria-label="New Chat">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <!-- Chat List -->
  <div class="flex-1 overflow-y-auto px-4 py-3 relative">
    @if(isConversationsLoading()) {
    <div class="absolute inset-0 flex items-center justify-center">
      <mat-progress-spinner color="accent" mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>
    } @else {
    <div *ngFor="let chat of conversationList()" (click)="selectChat(chat)" class="flex items-center gap-4 p-3 rounded-lg cursor-pointer
                  border border-transparent hover:bg-gray-100 hover:border-gray-200 transition h-18 mb-2 relative"
      [class.bg-gray-100]="selectedConversation()?.id === chat.id">

      <!-- Avatar -->
      <mat-icon class="text-gray-500 text-xl flex-shrink-0">account_circle</mat-icon>

      <!-- Chat Info -->
      <div class="flex flex-col overflow-hidden">
        <div class="text-base font-semibold text-gray-900 truncate max-w-xs">
          {{ chat.name }}
        </div>

        <div class="text-sm text-gray-600 truncate max-w-xs flex items-center gap-1"
          [ngClass]="chat.hasUnreadMessages ? 'text-blue-600 font-bold' : 'text-gray-500'">
          {{ chat.lastMessage }}
        </div>
      </div>

      <span *ngIf="chat.hasUnreadMessages" class="absolute top-3 right-3 w-2 h-2 rounded-full bg-blue-500"></span>

    </div>
    }
  </div>

  <!-- Logout -->
  <ng-container *ngIf="userDetailState$ | async as state">

    <!-- 1. Loading State -->
    <ng-container *ngIf="state.isLoading; else loaded">
      <div class="flex items-center gap-3 p-4 animate-pulse">
        <div class="w-10 h-10 bg-gray-300 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="h-3 bg-gray-300 rounded w-1/3"></div>
          <div class="h-4 bg-gray-300 rounded w-1/2"></div>
        </div>
      </div>
    </ng-container>

    <!-- 2. Loaded: Error or User Panel -->
    <ng-template #loaded>
      <ng-container *ngIf="state.error; else userPanel">
        <div class="p-4 text-sm text-red-600">
          {{ state.error }}
        </div>
      </ng-container>
    </ng-template>

    <!-- 3. Logged-in User Panel -->
    <ng-template #userPanel>
      <div class="flex items-center justify-between bg-white p-4 shadow border-t-1 border-t-gray-100">
        <!-- Avatar + Status + Name -->
        <div class="flex items-center gap-3">
          <div class="relative">
            <mat-icon>accessibility</mat-icon>
            <!-- <img [src]="state.data?.profileImageUrl || defaultAvatar" alt="Avatar"
              class="w-10 h-10 rounded-full object-cover" /> -->
            <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full
                       ring-2 ring-white" [ngClass]="{
                  'bg-[#3d5afe]': state.data?.status === 'online',
                  'bg-gray-400':   state.data?.status !== 'online'
                }"></span>
          </div>
          <div class="flex flex-col">
            <span class="text-xs text-gray-500">
              Logged in as
            </span>
            <span class="text-sm font-semibold
                       text-gray-900
                       truncate">
              {{ state.data?.name }}
            </span>
          </div>
        </div>

        <!-- Action Menu -->
        <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Open user menu" class="text-[#3d5afe] hover:text-[#3d5afe]/80">
          <mat-icon>more_vert</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu">
          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            <span>Profile</span>
          </button>
          <button mat-menu-item>
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
          </button>
          <button mat-menu-item (click)="logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    </ng-template>

  </ng-container>


</div>
