<div class="flex h-screen bg-gray-50 text-gray-800 font-[Inter]">
  <!-- Sidebar -->
  <aside class="w-72 border-r border-gray-200 bg-white">
    <chat-chat-sidebar />
  </aside>

  <!-- Chat Thread -->
  <main class="flex-1 flex flex-col">

    <!-- Chat Header -->
    <div class="flex items-center gap-3 px-6 py-4 bg-white">
      <mat-icon class="text-gray-400">account_circle</mat-icon>
      <div class="font-medium text-base">
        {{ selectedConversation()?.name || 'Select a Chat' }}
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 p-6 space-y-4 overflow-y-auto flex flex-col bg-gray-50">
      <div *ngFor="let message of messages" [ngClass]="
          message.fromMe
            ? 'self-end bg-blue-600 text-white'
            : 'self-start bg-white text-gray-800 border'
        " class="max-w-xs p-3 rounded-xl text-sm shadow-sm">
        {{ message.text }}
      </div>
    </div>

    <!-- Message Input -->
    <div class="px-6 py-4 bg-white flex items-center gap-3">
      <mat-form-field subscriptSizing="dynamic" class="flex-1 appearance-outline">
        <input matInput placeholder="Message..." [(ngModel)]="messageText" (keydown.enter)="sendMessage()" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="sendMessage()" class="normal-case">
        Send
      </button>
    </div>

  </main>

</div>
