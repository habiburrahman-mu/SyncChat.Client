<div class="flex h-screen">

  <!-- Sidebar -->
  <div class="w-72 h-full border-r border-gray-300 bg-white flex flex-col">
    <div class="p-4 text-xl font-bold border-b">Chats</div>

    <mat-form-field class="m-2" appearance="outline">
      <mat-label>Search</mat-label>
      <input matInput type="text" />
    </mat-form-field>

    <div class="flex-1 overflow-y-auto">
      <button *ngFor="let chat of chats" (click)="selectChat(chat)"
        class="w-full flex items-center gap-3 px-4 py-3 hover:bg-gray-100 focus:bg-gray-200 text-left">
        <mat-icon class="text-gray-500">account_circle</mat-icon>
        <div>
          <div class="font-medium">{{ chat.name }}</div>
          <div class="text-xs text-gray-500 truncate w-40">
            {{ chat.lastMessage }}
          </div>
        </div>
      </button>
    </div>
  </div>

  <!-- Chat Thread -->
  <div class="flex-1 flex flex-col h-full">

    <!-- Header -->
    <div class="p-4 border-b flex items-center gap-3">
      <mat-icon class="text-gray-600">account_circle</mat-icon>
      <div class="font-medium text-lg">
        {{ selectedChat?.name || 'Select a Chat' }}
      </div>
    </div>

    <!-- Message List -->
    <div class="flex-1 p-4 space-y-4 overflow-y-auto bg-gray-50 flex flex-col">

      <div *ngFor="let message of messages" [ngClass]="
      message.fromMe
        ? 'self-end bg-blue-500 text-white'
        : 'self-start bg-white text-gray-800 border'
    " class="max-w-xs p-3 rounded-2xl shadow">
        {{ message.text }}
      </div>

    </div>

    <!-- Message Input -->
    <div class="p-4 border-t flex items-center gap-2">
      <mat-form-field class="flex-1" appearance="outline">
        <input matInput placeholder="Type a message..." [(ngModel)]="messageText" (keydown.enter)="sendMessage()" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="sendMessage()">
        Send
      </button>
    </div>

  </div>
</div>
