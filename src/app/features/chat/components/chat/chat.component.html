<div class="flex h-screen bg-gray-100">
  <!-- Left Sidebar for Chat List -->
  <aside class="w-80 bg-white border-r flex flex-col">
    <div class="p-4 border-b flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-600">SyncChat</h1>
      <button mat-icon-button color="primary" (click)="newChat()">
        <mat-icon>chat</mat-icon>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto">
      <mat-nav-list>
        <mat-list-item *ngFor="let chat of chatList" (click)="selectChat(chat)"
          class="hover:bg-gray-100 cursor-pointer">
          <div class="flex items-center">
            <mat-icon class="w-12 h-12 bg-indigo-500 rounded-full mr-4">account_circle</mat-icon>
            <div>
              <div mat-line class="font-medium">{{ chat.name }}</div>
              <div mat-line class="text-xs text-gray-500 truncate">{{ chat.lastMessage }}</div>
            </div>
          </div>
        </mat-list-item>
      </mat-nav-list>
    </div>
  </aside>

  <!-- Right Side: Chat Window -->
  <main class="flex-1 flex flex-col bg-white">
    <!-- Header with Chat Name -->
    <div class="flex items-center justify-between p-4 border-b bg-white shadow-md">
      <div class="flex items-center">
        <mat-icon class="w-12 h-12 bg-indigo-500 rounded-full mr-3">account_circle</mat-icon>
        <div class="text-lg font-semibold text-gray-800">{{ selectedChat?.name || 'Select a conversation' }}</div>
      </div>
      <button mat-icon-button>
        <mat-icon>more_vert</mat-icon>
      </button>
    </div>

    <!-- Messages Section -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-sky-50">
      <div *ngFor="let message of messages" class="flex justify-between">
        <div [ngClass]="message.isOwn ? 'ml-auto' : 'mr-auto'">
          <div class="flex items-center space-x-2">
            <mat-icon class="w-10 h-10 bg-indigo-500 rounded-full"></mat-icon>
            <div class="inline-block max-w-xs p-3 rounded-xl shadow-md"
              [ngClass]="message.isOwn ? 'bg-indigo-600 text-white' : 'bg-white text-gray-800 border border-gray-300'">
              <p class="text-sm">{{ message.text }}</p>
              <div class="text-xs text-gray-500 mt-1 text-right">{{ message.time }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Message Input Section -->
    <div class="flex items-center p-4 border-t bg-white shadow-md">
      <input matInput type="text" [(ngModel)]="newMessage" placeholder="Type a message…"
        class="flex-1 border rounded-lg px-4 py-2 mr-2 focus:outline-none focus:ring focus:border-indigo-400"
        (keydown.enter)="sendMessage()" />
      <button mat-icon-button color="primary" (click)="sendMessage()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </main>
</div>
