<div class="flex h-screen bg-gray-50 text-gray-800 font-[Inter]">
  <!-- Sidebar -->
  <aside class="w-72 border-gray-200 bg-white flex-shrink-0">
    <chat-chat-sidebar />
  </aside>

  <!-- <button type="button" matButton (click)="drawer.toggle()">
    Toggle sidenav
  </button> -->

  <!-- Chat Thread -->
  <main class="flex-1">
    <mat-drawer-container>
      <mat-drawer-content>
        <chat-chat-thread />
      </mat-drawer-content>

      @if(selectedConversation()) {
      <mat-drawer mode="side" position="end" [opened]="isChatDetailPanelOpen()">
        <chat-detail-panel />
      </mat-drawer>
      }

    </mat-drawer-container>
  </main>
</div>
