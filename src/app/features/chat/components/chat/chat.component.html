<mat-drawer-container class="h-full">
  <mat-drawer mode="side" opened>
    <h4>This is a drawer</h4>
  </mat-drawer>
  <mat-drawer-content>
    <h1 class="text-3xl font-bold underline">
      Hello world!
    </h1>

    <div class="flex flex-row gap-1 p-2">
      <div class="bg-blue-500 rounded-md p-2 size-15">01</div>
      <div class="bg-blue-500 rounded-md p-2 flex-grow">02</div>
      <div class="bg-blue-500 rounded-md p-2 size-15">03</div>
    </div>

    <p>chat works!</p>
    <mat-accordion>
      <mat-expansion-panel hideToggle>
        <mat-expansion-panel-header>
          <mat-panel-title> This is the expansion title </mat-panel-title>
          <mat-panel-description> This is a summary of the content </mat-panel-description>
        </mat-expansion-panel-header>
        <p>This is the primary content of the panel.</p>
      </mat-expansion-panel>
      <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
        <mat-expansion-panel-header>
          <mat-panel-title> Self aware panel </mat-panel-title>
          <mat-panel-description>
            Currently I am {{panelOpenState() ? 'open' : 'closed'}}
          </mat-panel-description>
        </mat-expansion-panel-header>
        <p>I'm visible because I am open</p>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-drawer-content>
</mat-drawer-container>
