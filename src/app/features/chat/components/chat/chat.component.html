<div class="safe-dvh h-full font-[Inter] bg-slate-50">
  <mat-drawer-container class="h-full min-h-0" autosize>

    <!-- ── Left Sidebar (desktop) ──────────────────────────────── -->
    @if(!isMobileScreen()) {
    <mat-drawer
      [mode]="chatListPanelPinned() ? 'side' : 'over'"
      [opened]="(chatListPanelOpen() || chatListPanelPinned())"
      [(opened)]="chatListPanelOpen"
      class="chat-sidebar-drawer">
      <aside class="w-72 h-full bg-white">
        <chat-chat-sidebar />
      </aside>
    </mat-drawer>
    }

    <!-- ── Main Content ────────────────────────────────────────── -->
    <mat-drawer-content class="flex flex-col h-full bg-slate-50">
      <main class="flex-1 h-full min-h-0 chat-inner-container">
        <mat-drawer-container class="h-full">
          <mat-drawer-content>
            <chat-chat-thread />
          </mat-drawer-content>

          @if(selectedConversation()) {
          <mat-drawer mode="over" position="end" [(opened)]="isChatDetailPanelOpen"
            class="chat-detail-drawer !w-80">
            <chat-detail-panel />
          </mat-drawer>
          }

        </mat-drawer-container>
      </main>
    </mat-drawer-content>

  </mat-drawer-container>
</div>
