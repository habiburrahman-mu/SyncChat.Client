<div class="flex h-screen bg-gray-50 text-gray-800 font-[Inter]">

  <!-- Sidebar -->
  <aside class="w-72 flex flex-col border-r border-gray-200 bg-white">

    <!-- Sidebar Header -->
    <div class="flex items-center justify-between px-5 py-4">
      <span class="text-lg font-semibold">Chats</span>
    </div>

    <!-- Search & New Chat Button -->
    <div class="px-5 py-4 space-y-3 flex felx-row items-center gap-2">
      <mat-form-field appearance="outline" class="w-full h-10">
        <input matInput placeholder="Search chats" />
      </mat-form-field>

      <button mat-mini-fab color="primary" (click)="createNewChat()" aria-label="New Chat">
        <mat-icon>add</mat-icon>
      </button>
    </div>

    <!-- Chat List -->
    <div class="flex-1 overflow-y-auto px-4 py-3">
      <div *ngFor="let chat of chats" (click)="selectChat(chat)" class="flex items-center gap-4 p-3 rounded-lg cursor-pointer hover:bg-gray-100 transition
           border border-transparent hover:border-gray-200 h-18 mb-2" [class.bg-gray-100]="selectedChat?.id === chat.id">
        <!-- Avatar -->
        <mat-icon class="text-gray-500 text-xl flex-shrink-0">account_circle</mat-icon>

        <!-- Chat Info -->
        <div class="flex flex-col overflow-hidden">
          <div class="text-base font-semibold text-gray-900 truncate max-w-xs">
            {{ chat.name }}
          </div>
          <div class="text-sm text-gray-600 truncate max-w-xs">
            {{ chat.lastMessage }}
          </div>
        </div>
      </div>
    </div>



    <!-- Logout -->
    <div class="px-5 py-4">
      <button mat-raised-button (click)="logout()"
        class="flex items-center gap-2 text-sm text-gray-500 hover:text-red-600 normal-case">
        <mat-icon class="text-base">logout</mat-icon>
        Logout
      </button>
    </div>

  </aside>

  <!-- Chat Thread -->
  <main class="flex-1 flex flex-col">

    <!-- Chat Header -->
    <div class="flex items-center gap-3 px-6 py-4 bg-white">
      <mat-icon class="text-gray-400">account_circle</mat-icon>
      <div class="font-medium text-base">
        {{ selectedChat?.name || 'Select a Chat' }}
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 p-6 space-y-4 overflow-y-auto flex flex-col bg-gray-50">
      <div *ngFor="let message of messages" [ngClass]="
          message.fromMe
            ? 'self-end bg-blue-600 text-white'
            : 'self-start bg-white text-gray-800 border'
        " class="max-w-xs p-3 rounded-xl text-sm shadow-sm">
        {{ message.text }}
      </div>
    </div>

    <!-- Message Input -->
    <div class="px-6 py-4 bg-white flex items-center gap-3">
      <mat-form-field subscriptSizing="dynamic" class="flex-1 appearance-outline">
        <input matInput placeholder="Message..." [(ngModel)]="messageText" (keydown.enter)="sendMessage()" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="sendMessage()" class="normal-case">
        Send
      </button>
    </div>

  </main>

</div>
