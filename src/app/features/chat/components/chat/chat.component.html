<div class="flex flex-col h-screen bg-gray-100">
  <!-- Header -->
  <div class="bg-white p-4 shadow flex items-center justify-between">
    <h2 class="text-lg font-semibold">Chat</h2>
    <span class="text-sm text-gray-500">Online</span>
  </div>

  <!-- Messages Area -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4">
    <div *ngFor="let message of messages" [ngClass]="message.sender === 'user' ? 'justify-end' : 'justify-start'" class="flex">
      <div [ngClass]="message.sender === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-300 text-gray-800'"
           class="px-4 py-2 rounded-lg max-w-xs break-words">
        {{ message.text }}
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="bg-white p-4 flex items-center gap-2">
    <input
      type="text"
      [(ngModel)]="newMessage"
      (keydown.enter)="sendMessage()"
      placeholder="Type a message..."
      class="flex-1 p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
    />
    <button
      (click)="sendMessage()"
      class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition"
    >
      Send
    </button>
  </div>
</div>
