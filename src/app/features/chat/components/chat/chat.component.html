<div class="h-screen bg-gray-50 text-gray-800 font-[Inter]">
  <!-- Sidebar -->
  <mat-drawer-container class="flex">
    @if(!isMobileScreen()) {
    <mat-drawer [mode]="chatListPanelPinned() ? 'side' : 'over'"
      [opened]="(chatListPanelOpen() || chatListPanelPinned())" class="h-screen" [(opened)]="chatListPanelOpen">
      <aside class="w-72 border-gray-200 bg-white shrink-0 h-screen">
        <chat-chat-sidebar />
      </aside>
    </mat-drawer>
    }

    <mat-drawer-content class="flex flex-col flex-1 h-screen">
      <!-- Chat Thread -->
      <main class="flex-1">
        <mat-drawer-container>
          <mat-drawer-content>
            <chat-chat-thread />
          </mat-drawer-content>

          @if(selectedConversation()) {
          <mat-drawer mode="over" position="end" [(opened)]="isChatDetailPanelOpen">
            <chat-detail-panel />
          </mat-drawer>
          }

        </mat-drawer-container>
      </main>
    </mat-drawer-content>
  </mat-drawer-container>
</div>
