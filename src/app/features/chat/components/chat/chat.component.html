<div class="flex h-screen bg-gray-50 text-gray-800 font-[Inter]">
  <!-- Sidebar -->
  <aside class="w-72 border-r border-gray-200 bg-white">
    <chat-chat-sidebar />
  </aside>

  <!-- Chat Thread -->
  <main class="flex-1 flex flex-col relative">

    @if(isConversationsLoading() || isSelectedConversationMessagesLoading()) {

    <div class="absolute inset-0 flex items-center justify-center">
      <mat-progress-spinner color="accent" mode="indeterminate" diameter="40">
      </mat-progress-spinner>
    </div>

    }
    @else {

    <!-- Chat Header -->
    <div class="flex items-center gap-3 px-6 py-4 bg-white">
      <mat-icon class="text-gray-400">account_circle</mat-icon>
      <div class="font-medium text-base">
        {{ selectedConversation()?.name || 'Select a Chat' }}
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 p-6 space-y-4 overflow-y-auto flex flex-col justify-end bg-gray-50">
      <div *ngFor="let message of messages() ?? []" class="flex flex-col max-w-xs mb-2" [ngClass]="
         message.senderId === currentUserId
           ? 'self-end text-white'
           : 'self-start text-gray-800'
       ">

        <!-- Sender username (with @) and matTooltip for full name -->
        <span *ngIf="message.senderId !== currentUserId" class="text-xs font-medium mb-1"
          [matTooltip]="message.senderName" [matTooltipShowDelay]="500" [matTooltipHideDelay]="500">
          &#64;{{ message.senderUserName }}
        </span>

        <!-- Message content -->
        <div [ngClass]="
            message.senderId === currentUserId
              ? 'bg-blue-600'
              : 'bg-white border'
          " class="p-3 rounded-xl text-sm shadow-sm">
          {{ message.content }}
        </div>

      </div>
    </div>



    <!-- Message Input -->
    <div class="px-6 py-4 bg-white flex items-center gap-3">
      <mat-form-field subscriptSizing="dynamic" class="flex-1 appearance-outline">
        <input matInput placeholder="Message..." [(ngModel)]="messageText" (keydown.enter)="sendMessage()" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="sendMessage()" class="normal-case">
        Send
      </button>
    </div>

    }
  </main>



</div>
