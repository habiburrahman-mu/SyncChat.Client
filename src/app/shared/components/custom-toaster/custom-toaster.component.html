<div class="toaster-content" [ngStyle]="{ '--loader-duration': duration + 'ms' }">
  <div class="toaster-text">
    <div class="toaster-title">{{ data.title }}</div>
    @if (data.summary !== undefined) {
    <div class="toaster-summary">{{ data.summary }}</div>
    }
  </div>
  <button mat-icon-button (click)="close()" class="toaster-close-btn">
    <mat-icon fontIcon="close"></mat-icon>
  </button>
</div>
